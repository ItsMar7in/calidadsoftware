<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Reservar - AulaLibre</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <!-- Navbar -->
   <!-- Navbar + Parallax Header -->
<nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo">AulaLibre</a>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li class="dropdown">
          <a href="#">Salas</a>
          <ul class="dropdown-menu">
            <li><a href="salas.html">Ver Salas</a></li>
            <li><a href="reservar.html">Reservar</a></li>
          </ul>
        </li>
        <li class="dropdown">
          <a href="#">Calendario</a>
          <ul class="dropdown-menu">
            <li><a href="calendario.html">Disponibilidad</a></li>
            <li><a href="reservas.html">Mis Reservas</a></li>
          </ul>
        </li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
      <button class="toggle-btn">☰</button>
    </div>
  </nav>
  
  <!-- Hero con parallax (opcional: solo si quieres que aparezca en todas las páginas) -->
  <header class="hero">
    <div class="hero-content">
      <h1>Reserva de Salas de Cómputo</h1>
      <p>Organiza tus sesiones fácilmente</p>
    </div>
    <div class="parallax">
      <svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
        <path fill="#f0f4f8" fill-opacity="1"
          d="M0,192L48,176C96,160,192,128,288,138.7C384,149,480,203,576,213.3C672,224,768,192,864,181.3C960,171,1056,181,1152,192C1248,203,1344,213,1392,218.7L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">
        </path>
      </svg>
    </div>
  </header>
  

  <main class="container">
    <section class="form-section">
      <h2>Reservar Sala</h2>
      <form id="reservaForm" novalidate>
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required />
        </div>
        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" id="correo" required />
        </div>
        <div class="form-group">
          <label for="sala">Sala</label>
          <select id="sala" required></select>
        </div>
        <div class="form-group">
          <label for="fecha">Fecha</label>
          <select id="fecha" required></select>
        </div>
        <div class="form-group">
          <label for="hora">Hora</label>
          <select id="hora" required></select>
        </div>
        <button type="submit">Reservar</button>
      </form>
    </section>
  </main>
  <div id="toast" class="toast">Reserva realizada correctamente ✅</div>
</body>
</html>
